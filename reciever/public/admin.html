<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reciever Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --fg: #000000;
      --muted: #F2F2F2;
      --accent: #FF3000;
      --border: #000000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      padding: 10px;
    }
    .wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px; }
    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 86px);
      line-height: 0.88;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.04em;
    }
    .card {
      background: var(--bg);
      border: 2px solid var(--border);
      padding: 10px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      border: 2px solid var(--border);
      border-radius: 0;
      padding: 10px 13px;
      min-height: 44px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      transition: background-color 180ms ease-out, color 180ms ease-out, transform 180ms ease-out;
    }
    .start { background: var(--fg); color: var(--bg); }
    .end { background: var(--bg); color: var(--fg); }
    .start:hover, .end:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: translateY(-1px); }
    .start:focus-visible, .end:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .muted { color: #222; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
    .ok { color: #000; background: #F2F2F2; border: 2px solid #000; padding: 1px 6px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
    .bad { color: #fff; background: var(--accent); border: 2px solid var(--accent); padding: 1px 6px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 6px 0; border-bottom: 2px solid #000; vertical-align: top; }
    td:first-child { color: #111; width: 34%; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; }
    strong { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; }
    a {
      color: var(--fg);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-underline-offset: 3px;
    }
    a:hover { color: var(--accent); }
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <h1>Admin</h1>
      <span class="muted">Manage stream and monitor runtime stats</span>
    </div>

    <div class="card">
      <div class="row">
        <button id="toggleStreamBtn" class="start">End Live Stream</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="card">
        <div class="row" style="margin-bottom: 0.45rem;">
          <strong>Stream Stats</strong>
        </div>
        <table>
          <tbody id="statsBody"></tbody>
        </table>
      </div>
      <div class="card">
        <div class="row" style="margin-bottom: 0.45rem;">
          <strong>GPS Diagnostics</strong>
          <span class="muted">cgps-style detail from current feed</span>
        </div>
        <table>
          <tbody id="gpsBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const toggleStreamBtn = document.getElementById("toggleStreamBtn");
    const statsBody = document.getElementById("statsBody");

    function fmtMs(ms) {
      const s = Math.floor((ms || 0) / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const ss = s % 60;
      return `${h}h ${m}m ${ss}s`;
    }

    function row(name, value) {
      return `<tr><td>${name}</td><td>${value}</td></tr>`;
    }

    function fixLabel(fix) {
      if (fix == null) return "Unknown";
      if (fix === 0 || fix === 1) return "No fix / 2D";
      if (fix === 2) return "2D fix";
      if (fix === 3) return "3D fix";
      return String(fix);
    }

    function toDms(v, lat) {
      if (!Number.isFinite(v)) return "n/a";
      const abs = Math.abs(v);
      const deg = Math.floor(abs);
      const minFull = (abs - deg) * 60;
      const min = Math.floor(minFull);
      const sec = (minFull - min) * 60;
      const hemi = lat ? (v >= 0 ? "N" : "S") : (v >= 0 ? "E" : "W");
      return `${deg}° ${min}' ${sec.toFixed(2)}" ${hemi}`;
    }

    async function setStream(action) {
      const r = await fetch("/api/admin/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action }),
      });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "Failed");
      return j;
    }

    async function refresh() {
      try {
        const r = await fetch("/api/admin/stats");
        const s = await r.json();
        toggleStreamBtn.textContent = s.streamActive ? "End Live Stream" : "Start Live Stream";
        toggleStreamBtn.classList.toggle("start", s.streamActive);
        toggleStreamBtn.classList.toggle("end", !s.streamActive);
        statsBody.innerHTML = [
          row("Uptime", fmtMs(s.uptimeMs)),
          row("Encoder", s.encoderConnected ? '<span class="ok">Connected</span>' : '<span class="bad">Disconnected</span>'),
          row("Video subscribers", s.videoSubscribers),
          row("Approx FPS", s.fpsApprox),
          row("Frames received", s.framesReceived),
          row("GPS updates", s.gpsUpdates),
          row("GPS fresh", s.gpsFresh ? '<span class="ok">Yes</span>' : '<span class="bad">No</span>'),
          row("Camera fresh", s.cameraFresh ? '<span class="ok">Yes</span>' : '<span class="bad">No</span>'),
          row("Servo requests", s.servoRequests),
          row("Servo ACK ok", s.servoAcksOk),
          row("Servo ACK errors", s.servoAcksErr),
          row("Encoder connects", s.encoderConnects),
          row("Encoder disconnects", s.encoderDisconnects),
          row("Last frame age", s.frameAgeMs == null ? "n/a" : `${s.frameAgeMs} ms`),
          row("Last GPS age", s.gpsAgeMs == null ? "n/a" : `${s.gpsAgeMs} ms`),
        ].join("");

        const gpsBody = document.getElementById("gpsBody");
        gpsBody.innerHTML = [
          row("Fix mode", fixLabel(s.fix)),
          row("GPS source UTC", s.utc || "n/a"),
          row("Lat / Lon (decimal)", s.lat != null && s.lon != null ? `${Number(s.lat).toFixed(7)}, ${Number(s.lon).toFixed(7)}` : "n/a"),
          row("Latitude (DMS)", s.lat != null ? toDms(Number(s.lat), true) : "n/a"),
          row("Longitude (DMS)", s.lon != null ? toDms(Number(s.lon), false) : "n/a"),
          row("Altitude", s.alt != null ? `${Number(s.alt).toFixed(2)} m` : "n/a"),
          row("Speed", s.speedKmh != null ? `${Number(s.speedKmh).toFixed(2)} km/h` : "n/a"),
          row("Track / Course", s.course != null ? `${Number(s.course).toFixed(2)}°` : "n/a"),
          row("Mag Track / Var", (s.magtrack != null || s.magvar != null) ? `${s.magtrack ?? "n/a"}° / ${s.magvar ?? "n/a"}°` : "n/a"),
          row("Satellites", s.satellites ?? "n/a"),
          row("nSat / uSat", (s.nSat != null || s.uSat != null) ? `${s.nSat ?? "n/a"} / ${s.uSat ?? "n/a"}` : "n/a"),
          row("HDOP", s.hdop != null ? Number(s.hdop).toFixed(2) : "n/a"),
          row("PDOP / VDOP / TDOP / GDOP", (s.pdop != null || s.vdop != null || s.tdop != null || s.gdop != null)
            ? `${s.pdop ?? "n/a"} / ${s.vdop ?? "n/a"} / ${s.tdop ?? "n/a"} / ${s.gdop ?? "n/a"}`
            : "n/a"),
          row("Estimated accuracy", s.accuracyM != null ? `±${Number(s.accuracyM).toFixed(1)} m` : "n/a"),
          row("EPH / EPV / SEP / EPS", (s.eph != null || s.epv != null || s.sep != null || s.eps != null)
            ? `${s.eph ?? "n/a"} / ${s.epv ?? "n/a"} / ${s.sep ?? "n/a"} / ${s.eps ?? "n/a"}`
            : "n/a"),
          row("NMEA UTC time", s.time || "n/a"),
          row("NMEA UTC date", s.date || "n/a"),
          row("Updated at", s.updatedAt ? new Date(s.updatedAt).toISOString() : "n/a"),
        ].join("");

      } catch (e) {
        toggleStreamBtn.textContent = "Stream Control Error";
        toggleStreamBtn.classList.add("end");
        toggleStreamBtn.classList.remove("start");
      }
    }

    toggleStreamBtn.addEventListener("click", async () => {
      const shouldEnd = toggleStreamBtn.textContent.toLowerCase().includes("end");
      try { await setStream(shouldEnd ? "end" : "start"); } finally { refresh(); }
    });

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
